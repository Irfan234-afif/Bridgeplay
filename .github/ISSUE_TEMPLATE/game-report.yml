name: Game report
description: Report how a Windows game runs under Bridgeplay
title: "[Game] <name> (<appid>)"
labels: ["game-report"]
body:
  - type: markdown
    attributes:
      value: |
        Played it with the Bridgeplay app? Fill in the fields and attach the game's `bridgeplay-run.log` (Prefixes page › the game › Open Log).

        Working from a Bridgeplay checkout? Run `scripts/np-test-game.sh <appid> --stop` instead and attach the zipped `compat/runs/<appid>-<timestamp>/` folder.
  - type: input
    id: name
    attributes:
      label: Game name
    validations:
      required: true
  - type: input
    id: appid
    attributes:
      label: Steam AppID
      description: The number in the store URL.
      placeholder: "1966720"
    validations:
      required: true
  - type: dropdown
    id: api
    attributes:
      label: Graphics API of the game
      description: PCGamingWiki lists it; choose Unknown if unsure.
      options: [Unknown, D3D9, D3D10, D3D11, D3D12, Vulkan, OpenGL, "D3D11 + D3D12"]
    validations:
      required: true
  - type: input
    id: anticheat
    attributes:
      label: Anti-cheat
      description: Easy Anti-Cheat, BattlEye, Vanguard, VAC, none, etc.
      placeholder: none
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - platinum (perfect out of the box)
        - gold (perfect after tweaks)
        - silver (playable with minor issues)
        - bronze (runs, major issues)
        - borked (does not run)
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend used
      options: [dxmt, dxvk, wined3d, d3dmetal, default (no gamefix)]
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine
      placeholder: WineCX 11.17
    validations:
      required: true
  - type: input
    id: fork_commit
    attributes:
      label: Bridgeplay version
      description: Shown at the bottom of the app's sidebar (for example 3.0.1 (35)), or `git rev-parse --short HEAD` in a checkout.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model and macOS version
      placeholder: MacBook Pro M3 Pro, macOS 26.0
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What works, what breaks (black screen, crash on load, missing audio, input), settings or gamefix keys used.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag and drop `bridgeplay-run.log`, or the zipped `compat/runs/<appid>-<timestamp>/` folder, or paste `result.json`.
