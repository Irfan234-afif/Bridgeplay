name: Bug report
description: Something in Bridgeplay doesn't work (setup, Steam, updates, controllers)
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bridgeplay version
      description: Shown at the bottom of the app's sidebar, for example "Bridgeplay 3.0.1 (35)".
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Mac and macOS version
      placeholder: MacBook Pro M3, macOS 26.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach `~/Library/Application Support/bridgeplay/bridgeplay.log`. For a game, also
        attach its `bridgeplay-run.log` (Prefixes page › the game › Open Log).
      render: text
