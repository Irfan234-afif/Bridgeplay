# eFootball™ (1665460)
# The match simulation follows the frame rate: above 60 fps the game runs fast-forward,
# below it plays in slow motion, so the frame budget is a hard 16.6 ms and there is no
# graceful degradation (Steam discussion 588438959484636138, "SLOW MOTION GAMEPLAY").
# Evidence: the seven compatibility reports for this appid (#349, #498, #751, #760, #784,
# #832, #844) all run d3dmetal on WineCX 11.17, and the four with major issues name low
# frame rate, stutter or "slow down tempo". On an M4 (#832, 2026-10-25) the player kept the
# display, backend, Metal HUD, msync and Retina settings as they were, turned the Steam
# in-game overlay off, and played a full match without the slow motion. That part is a
# player's observation, not a measurement.
# Note on what the switch does: with the overlay off in Steam the renderer is still staged
# into the process (the shim logs overlay=present in bridgeplay-wine.log), so what changed
# is the overlay being inactive rather than absent. OVERLAY=0 clears
# STEAM_DYLD_INSERT_LIBRARIES, so the launcher inserts neither it nor the shim, which
# should be at least as effective. That stronger claim is untested.
OVERLAY=0
