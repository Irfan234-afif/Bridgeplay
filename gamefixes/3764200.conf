# Resident Evil Requiem (3764200)
# Evidence: PCGamingWiki lists Direct3D 12 as the only Direct3D version (https://www.pcgamingwiki.com/wiki/Resident_Evil_Requiem).
# Route D3D12 through wined3d (vkd3d); the WineCX engine with D3DMetal runs d3dmetal instead.
BACKEND=wined3d
# RE Engine hides DLSS (and XeSS) when it detects Wine; re9.exe takes /WineDetectionEnabled:False
# (string in re9.exe; the switch Proton users pass, ResetEra RE Requiem PC performance thread p.16).
ARGS=/WineDetectionEnabled:False
# RE9 locks its vsync off with frame generation on and tears; force display sync.
VSYNC=1
