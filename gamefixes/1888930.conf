# The Last of Us Part I (1888930)
# Evidence: PCGamingWiki lists Direct3D 12 as the only Direct3D version (https://www.pcgamingwiki.com/wiki/The_Last_of_Us_Part_I).
# Route D3D12 through wined3d (vkd3d); prefer BACKEND=d3dmetal once that engine ships.
BACKEND=wined3d
# Rosetta hides AVX/AVX2 by default; the game log stops right after its CPU feature probe
# (2026-10-09: "Features: mmx, sse ... cmpxchg16b", no avx), then exits. Rosetta exposes AVX when
# ROSETTA_ADVERTISE_AVX=1 (https://developer.apple.com/forums/thread/769486).
ROSETTA_ADVERTISE_AVX=1
