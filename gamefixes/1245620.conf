# ELDEN RING (1245620)
# Evidence: PCGamingWiki lists Direct3D 12 as the only Direct3D version (https://www.pcgamingwiki.com/wiki/Elden_Ring);
# DXMT only covers D3D10/11, so route D3D12 through wined3d (vkd3d). Use BACKEND=d3dmetal once that engine ships.
# Not translatable here: umu-protonfixes gamefixes-steam/1245620.py touches Game/DLC.bdt and Game/DLC.bhd so
# Easy Anti-Cheat accepts players without the DLC (https://github.com/Open-Wine-Components/umu-protonfixes).
# Easy Anti-Cheat (AreWeAntiCheatYet: Supported on Linux) is untested on this engine.
BACKEND=wined3d
