# Mortal Kombat 1 (1971870)
# Evidence: PCGamingWiki lists Direct3D 12 as the only Direct3D version (https://www.pcgamingwiki.com/wiki/Mortal_Kombat_1).
# Route D3D12 through wined3d (vkd3d); prefer BACKEND=d3dmetal once that engine ships.
BACKEND=wined3d
# Controllers do nothing in game unless the game sees SteamDeck=1 (GE-Proton 10-10 adds the same
# fix: https://github.com/GloriousEggroll/proton-ge-custom/releases/tag/GE-Proton10-10).
# Verified 2026-10-11: GameSir G7 Pro works in MK1 only with it.
STEAMDECK=1
