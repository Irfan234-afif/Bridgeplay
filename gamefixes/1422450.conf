# Deadlock: Source 2 takes any stdout as a console build (tier0 Plat_IsConsoleApplication)
# and then skips NGX, so DLSS is never offered.
STDOUT_NULL=1
# Deadlock audio: Source 2 autodetects a 1 ms mix-ahead under Wine and crackles; fixed latency
# and a 50 ms mix-ahead (the setting the installer shipped before gamefixes/ became its source).
# -dx11 keeps Direct3D 11 through D3DMetal (DLSS via MetalFX) even when the in-game Rendering API
# is set to Vulkan (boot.vcfg -vulkan), which goes through MoltenVK and stayed on a black screen.
ARGS=-dx11 +snd_autodetect_latency 0 +snd_mixahead 0.05
