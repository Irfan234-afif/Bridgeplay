# Marvel's Spider-Man 2 (2651280)
# Evidence: PCGamingWiki lists Direct3D 12 as the only Direct3D version (https://www.pcgamingwiki.com/wiki/Marvel%27s_Spider-Man_2).
# Route D3D12 through wined3d (vkd3d); prefer BACKEND=d3dmetal once that engine ships.
BACKEND=wined3d
# Spider-Man2.exe checks AVX/AVX2 at launch (strings: Launcher_CPUFeatureAVX2NotPresent_Message) and
# exits silently under Rosetta, which hides AVX unless ROSETTA_ADVERTISE_AVX=1 (observed 2026-10-09).
ROSETTA_ADVERTISE_AVX=1
